# GitHub Release Notes categorization (auto-generated notes + labels).
changelog:
  exclude:
    labels:
      - ignore-for-release
      - duplicate
      - invalid
      - question
      - wontfix
    authors:
      - dependabot[bot]
      - renovate[bot]
  categories:
    - title: Breaking Changes
      labels:
        - breaking
        - breaking-change
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Bug Fixes
      labels:
        - bug
        - fix
    - title: Performance
      labels:
        - performance
        - perf
    - title: Documentation
      labels:
        - documentation
        - docs
    - title: Refactoring
      labels:
        - refactor
        - refactoring
    - title: Tests
      labels:
        - test
        - tests
    - title: Build & CI
      labels:
        - build
        - ci
        - chore
    - title: Dependencies
      labels:
        - dependencies
    - title: Other Changes
      labels:
        - '*'
