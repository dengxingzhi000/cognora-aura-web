name: CodeQL Security Scan

# NOTE: this private repository does not have code scanning enabled (GitHub
# Advanced Security is required for CodeQL on private repos), so the scan is
# limited to the weekly schedule until the repository is published. Once code
# scanning is enabled, restore the push/pull_request triggers below.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  # push:
  #   branches: [main, master]
  # pull_request:
  #   branches: [main, master]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            paths: 'src/**'
          - language: actions
            paths: '.github/workflows/**'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
          build-mode: none
          # openapi-generator output is generated, never hand-edited.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
